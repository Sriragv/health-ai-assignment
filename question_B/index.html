<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diabetes Risk Check</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
    label { display: flex; justify-content: space-between; margin: 6px 0; }
    input { width: 120px; }
    button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 18px; white-space: pre-line; }
    .Low { background: #d4edda; } .Moderate { background: #fff3cd; } .High { background: #f8d7da; }
    .error { background: #eee; color: #a00; }
  </style>
</head>
<body>
  <h2>Diabetes Risk Check</h2>
  <div id="form"></div>
  <button onclick="predict()">Check my risk</button>
  <button onclick="loadStats()">Show stats</button>
  <div id="result"></div>
  <pre id="stats"></pre>

<script>
const FIELDS = {
  Pregnancies: 2, Glucose: 140, BloodPressure: 72, SkinThickness: 30,
  Insulin: 125, BMI: 33.5, DiabetesPedigreeFunction: 0.5, Age: 45
};
document.getElementById("form").innerHTML = Object.entries(FIELDS).map(
  ([k, v]) => `<label>${k} <input id="${k}" value="${v}"></label>`
).join("");

async function predict() {
  const body = {};
  for (const k of Object.keys(FIELDS)) body[k] = parseFloat(document.getElementById(k).value);
  const out = document.getElementById("result");
  const res = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (res.ok) {
    out.className = data.risk_level;
    out.textContent = data.message + " (" + data.note + ")";
  } else {
       out.className = "error";
    const errs = Array.isArray(data.detail)
      ? data.detail.map(e => `${e.loc[e.loc.length - 1]}: ${e.msg}`).join("\n")
      : data.detail;
    out.textContent = "Please fix:\n" + errs;
  }
}

async function loadStats() {
  const res = await fetch("/stats");
  document.getElementById("stats").textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
